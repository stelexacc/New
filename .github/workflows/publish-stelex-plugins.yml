name: Package Stelex in one folder without Admin
on:
  push:
    branches: [release/stelex-deepseek-free-plugins]
permissions:
  contents: write
concurrency:
  group: package-stelex-one-folder
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download previously verified installer and repair
        run: |
          gh release download v1.8.1-deepseek-fix --pattern 'STELEX-GPT-Setup-1.8.1-DeepSeek-Fix.exe*' --dir inputs
          gh release download v1.8.1-deepseek-fix --pattern 'STELEX-GPT-DeepSeek-Reparatur.zip*' --dir inputs
      - name: Package one directory and verify contents
        run: python3 release/stelex-plugins/one-folder.py inputs output
      - name: Publish folder package and checksum
        run: gh release upload v1.8.1-deepseek-fix output/STELEX-GPT-1.8.1-Alles-in-einem-Ordner.zip output/STELEX-GPT-1.8.1-Alles-in-einem-Ordner.zip.sha256 --clobber
