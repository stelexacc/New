name: Build and Windows-test complete Stelex folder
on:
  push:
    branches: [release/stelex-deepseek-free-plugins]
    paths:
      - 'release/stelex-plugins/build-client.py'
      - 'release/stelex-plugins/client/**'
      - 'release/stelex-plugins/admin/**'
      - 'release/stelex-plugins/build-admin.py'
      - 'release/stelex-plugins/payload/**'
      - '.github/workflows/publish-stelex-plugins.yml' 
permissions:
  contents: write
concurrency:
  group: stelex-complete-updated
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install official distribution build tools
        run: sudo apt-get update && sudo apt-get install -y nsis p7zip-full
      - name: Download verified base application
        run: gh release download v1.8.1 --pattern STELEX-GPT-1.8.1-Komplett.zip --dir base
      - name: Build and audit updated installer and one-folder package
        run: python3 release/stelex-plugins/build-client.py base/STELEX-GPT-1.8.1-Komplett.zip output
      - name: Test application APIs and output contracts
        run: node --test output/client-files/resources/app/tests/admin-updates.test.mjs output/client-files/resources/app/tests/file-output.test.mjs output/client-files/resources/app/tests/update.test.mjs output/client-files/resources/app/tests/deepseek-catalog.test.mjs
      - name: Build separate locked Admin package
        run: python3 release/stelex-plugins/build-admin.py base/STELEX-GPT-1.8.1-Komplett.zip output
      - name: Stage package in draft for Windows validation
        run: gh release upload v1.8.2-updates-admin output/Setup.exe output/Setup.exe.sha256 output/STELEX-GPT-Komplett-Aktualisiert.zip output/STELEX-GPT-Komplett-Aktualisiert.zip.sha256 output/STELEX-GPT-Client-Only-Dateiliste.json output/STELEX-Admin-Aktualisiert.zip output/STELEX-Admin-Aktualisiert.zip.sha256 --clobber
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download staged installer
        run: gh release download v1.8.2-updates-admin --pattern 'Setup.exe*' --dir downloads
      - name: Test Windows installation, selector, desktop startup and uninstall
        shell: powershell
        run: '& ./release/stelex-plugins/windows-client-smoke.ps1'
      - name: Download separate Admin package
        run: gh release download v1.8.2-updates-admin --pattern 'STELEX-Admin-Aktualisiert.zip*' --dir downloads
      - name: Test separate Admin lock and rejection of incorrect code
        shell: powershell
        run: '& ./release/stelex-plugins/admin/windows-admin-smoke.ps1'
  publish:
    needs: [build, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish only after Windows validation succeeds
        run: gh release edit v1.8.2-updates-admin --draft=false --latest=true
