name: Diagnose native voice before publication
on:
  push:
    branches: ['stelex-gpt-v1.6.0']
    paths: ['.github/workflows/voice-diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI: 'true'
      STELEX_DEMO_MODE: 'true'
      STELEX_VOICE_PERMISSION_SMOKE: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Inspect draft on actual Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $download=Join-Path $env:RUNNER_TEMP 'voice-diagnostic'
          New-Item -ItemType Directory $download | Out-Null
          gh release download v1.5.0 --dir $download --pattern 'Stelex-GPT-Windows-x64.zip'
          if($LASTEXITCODE -ne 0){throw 'Draft download failed'}
          Expand-Archive (Join-Path $download 'Stelex-GPT-Windows-x64.zip') $download
          $app=Join-Path $download 'Stelex-GPT-Windows-x64'
          $main=Join-Path $app 'resources\app\desktop\main.cjs'
          Copy-Item desktop\* (Join-Path $app 'resources\app\desktop') -Force
          Copy-Item server\* (Join-Path $app 'resources\app\server') -Force
          Copy-Item config (Join-Path $app 'resources\app') -Recurse -Force
          $source=[IO.File]::ReadAllText($main)
          $source=$source.Replace("app.commandLine.appendSwitch('use-fake-ui-for-media-stream');", "")
          $source=$source.Replace("let trusted = false;", "console.log('MEDIA REQUEST',permission,JSON.stringify(details));let trusted = false;")
          $source=$source.Replace("const target=BrowserWindow.fromWebContents(contents);", "console.log('MEDIA CHECK',permission,JSON.stringify(details));const target=BrowserWindow.fromWebContents(contents);")
          [IO.File]::WriteAllText($main,$source)
          $env:STELEX_SMOKE_TEST_FILE=Join-Path $download 'native-result.json'
          $p=Start-Process (Join-Path $app 'Stelex GPT.exe') -WorkingDirectory $app -RedirectStandardOutput (Join-Path $download 'stdout.txt') -RedirectStandardError (Join-Path $download 'stderr.txt') -PassThru
          if(-not $p.WaitForExit(60000)){taskkill.exe /PID $p.Id /T /F | Out-Null}
          foreach($name in @('native-result.json','stdout.txt','stderr.txt')){if(Test-Path (Join-Path $download $name)){Write-Host $name;Get-Content (Join-Path $download $name)}}
          if(-not (Test-Path $env:STELEX_SMOKE_TEST_FILE)){throw 'Missing diagnostic result'}
